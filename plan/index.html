<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="여러 개의 계획 라인을 만들고 가로로 연결하는 연결 리스트 계획표">
    <title>연결 리스트 계획</title>
    <link rel="stylesheet" href="plan.css?v=20260924-categories">
    <script src="plan.js?v=20260924-categories" defer></script>
</head>
<body>
    <main class="plan-page">
        <a class="back-link" href="../">← 메인으로</a>

        <header class="page-header">
            <div class="header-copy">
                <span class="eyebrow">LINKED PLAN</span>
                <h1>오늘의 흐름을<br>하나씩 연결하세요.</h1>
                <p>여러 개의 계획 라인을 만들고, 각 흐름을 순서대로 연결해 보세요.</p>
            </div>

            <div class="chain-preview" aria-hidden="true">
                <span>씻기</span><i>→</i><span>밥 먹기</span><i>→</i><span>산책</span>
            </div>
        </header>

        <section class="composer" aria-labelledby="composerTitle">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">NEW LINKED LIST</span>
                    <h2 id="composerTitle">새 개인 계획 라인 만들기</h2>
                </div>
                <p id="inputHelp">개인 일정의 각 단계를 한 줄씩 입력하면 새 연결 리스트 한 개가 됩니다.</p>
            </div>

            <form id="planForm" class="plan-form">
                <label class="visually-hidden" for="planInput">추가할 계획</label>
                <textarea
                    id="planInput"
                    name="plan"
                    rows="4"
                    maxlength="1200"
                    aria-describedby="inputHelp"
                    placeholder="씻기&#10;밥 먹기&#10;산책 가기"
                    required
                ></textarea>
                <button class="primary-button" type="submit">
                    <span id="submitLabel">개인 라인 만들기</span>
                    <span aria-hidden="true">＋</span>
                </button>
            </form>
        </section>

        <section class="plan-board" aria-labelledby="planTitle">
            <div class="board-heading">
                <div>
                    <span class="section-kicker">YOUR SEQUENCE</span>
                    <h2 id="planTitle">개인 연결 리스트</h2>
                </div>

                <div class="plan-summary" aria-label="계획 진행 상황">
                    <strong id="progressText">0개 라인 · 0 / 0 완료</strong>
                    <div
                        id="progressTrack"
                        class="progress-track"
                        role="progressbar"
                        aria-label="완료 진행률"
                        aria-valuemin="0"
                        aria-valuemax="100"
                        aria-valuenow="0"
                    >
                        <span id="progressBar"></span>
                    </div>
                </div>
            </div>

            <div class="plan-tabs" role="tablist" aria-label="일정 구분">
                <button
                    id="personalTab"
                    class="plan-tab is-active"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="planLines"
                    data-category="personal"
                >
                    <span class="plan-tab-label">개인</span>
                    <span id="personalTabCount" class="plan-tab-count">0</span>
                </button>
                <button
                    id="workTab"
                    class="plan-tab"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="planLines"
                    data-category="work"
                    tabindex="-1"
                >
                    <span class="plan-tab-label">회사</span>
                    <span id="workTabCount" class="plan-tab-count">0</span>
                </button>
            </div>

            <div id="emptyState" class="empty-state">
                <span class="empty-icon" aria-hidden="true">＋</span>
                <h3 id="emptyTitle">아직 개인 계획 라인이 없어요.</h3>
                <p id="emptyDescription">위 입력창에서 첫 번째 개인 계획을 만들어 보세요.</p>
            </div>

            <div
                id="planLines"
                class="plan-lines"
                role="tabpanel"
                aria-labelledby="personalTab"
            ></div>
        </section>

        <p id="liveMessage" class="visually-hidden" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
