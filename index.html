<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 관리 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 할 일 관리</h1>
        
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요...">
            <button id="addBtn">추가</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="todoCount">0개 남음</span>
            <button id="clearCompleted">완료된 항목 삭제</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
