<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="할 일, 순서가 있는 계획, 배운 내용을 한곳에서 기록하는 개인 대시보드">
    <title>나의 기록 공간</title>
    <link rel="manifest" href="./learning/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="shared/theme.js?v=20260925-modes"></script>
    <link rel="stylesheet" href="shared/theme.css?v=20260926-dark-contrast">
    <link rel="stylesheet" href="home.css?v=20260925-modes">
    <link rel="stylesheet" href="shared/auth-nav.css?v=20260925-modes">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" defer></script>
    <script src="shared/supabase-config.js?v=20260924-auth" defer></script>
    <script src="shared/backend.js?v=20260924-auth" defer></script>
</head>
<body>
    <main class="home">
        <div class="theme-controls" role="group" aria-label="화면 테마">
            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false"><span aria-hidden="true">☀</span> 라이트</button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false"><span aria-hidden="true">☾</span> 다크</button>
        </div>
        <div class="auth-nav" data-auth-nav data-login-href="./auth/" aria-label="계정 및 동기화 상태"></div>

        <header class="hero">
            <span class="eyebrow">MY DAILY SPACE</span>
            <h1>오늘의 계획과 배움을<br>차곡차곡 기록하세요.</h1>
            <p>할 일부터 순서가 있는 계획까지 실천하고, 새롭게 알게 된 내용을 나만의 기록으로 남겨보세요.</p>
        </header>

        <section class="menu" aria-label="서비스 메뉴">
            <a class="menu-card plan-card" href="./plan/">
                <span class="card-icon" aria-hidden="true">↳</span>
                <span class="card-number">01</span>
                <h2>연결 리스트 계획</h2>
                <p>개인과 회사 일정을 나누고, 각 계획을 순서대로 이어 흐름을 관리합니다.</p>
                <span class="card-link">순서 계획하기 <span aria-hidden="true">→</span></span>
            </a>

            <a class="menu-card learning-card" href="./learning/">
                <span class="card-icon" aria-hidden="true">✎</span>
                <span class="card-number">02</span>
                <h2>TIL</h2>
                <p>그때그때 배운 내용과 생각을 날짜별로 기록합니다.</p>
                <span class="card-link">새로운 배움 남기기 <span aria-hidden="true">→</span></span>
            </a>
        </section>

        <footer>매일 조금씩, 어제보다 한 걸음 더.</footer>
    </main>
</body>
</html>
