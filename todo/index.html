<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 관리</title>
    <script src="../shared/theme.js?v=20260925-modes"></script>
    <link rel="stylesheet" href="../shared/theme.css?v=20260926-dark-contrast">
    <link rel="stylesheet" href="../style.css?v=20260925-modes">
    <link rel="stylesheet" href="../shared/auth-nav.css?v=20260925-modes">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" defer></script>
    <script src="../shared/supabase-config.js?v=20260924-auth" defer></script>
    <script src="../shared/backend.js?v=20260924-auth" defer></script>
</head>
<body>
    <main class="container">
        <div class="theme-controls" role="group" aria-label="화면 테마">
            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false"><span aria-hidden="true">☀</span> 라이트</button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false"><span aria-hidden="true">☾</span> 다크</button>
        </div>
        <div class="auth-nav" data-auth-nav data-login-href="../auth/?redirect=../todo/" aria-label="계정 및 동기화 상태"></div>
        <a class="back-link" href="../">← 메인으로</a>
        <h1>📝 할 일 관리</h1>

        <div class="input-section">
            <label class="sr-only" for="todoInput">새로운 할 일</label>
            <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요...">
            <button id="addBtn" type="button">추가</button>
        </div>

        <div class="filter-section" aria-label="할 일 필터">
            <button class="filter-btn active" type="button" data-filter="all">전체</button>
            <button class="filter-btn" type="button" data-filter="active">진행중</button>
            <button class="filter-btn" type="button" data-filter="completed">완료</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="todoCount">0개 남음</span>
            <button id="clearCompleted" type="button">완료된 항목 삭제</button>
        </div>
    </main>

    <script src="../app.js?v=20260924-cloud" defer></script>
</body>
</html>
