<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 관리</title>
    <script src="../shared/theme.js?v=20261121-font2"></script>
    <link rel="stylesheet" href="../shared/theme.css?v=20261121-font2">
    <link rel="stylesheet" href="../style.css?v=20261121-refresh">
    <link rel="stylesheet" href="../shared/shell.css?v=20261121-font2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" defer></script>
    <script src="../shared/supabase-config.js?v=20260924-auth" defer></script>
    <script src="../shared/backend.js?v=20261121-save-queue" defer></script>
</head>
<body>
    <header class="app-bar">
        <a class="app-brand" href="../" aria-label="나의 기록 공간 홈">
            <svg class="app-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect class="logo-bg" width="32" height="32" rx="9"/><path class="logo-link" d="M8 16h16"/><circle class="logo-node" cx="8" cy="16" r="3"/><circle class="logo-node" cx="16" cy="16" r="3"/><circle class="logo-next" cx="24" cy="16" r="3"/></svg>
            <span class="app-brand-name">나의 기록 공간</span>
        </a>
        <nav class="app-nav" aria-label="주요 메뉴">
            <a href="../plan/">계획</a>
            <a href="../learning/">TIL</a>
        </nav>
        <div class="app-bar-end">
            <div class="auth-nav" data-auth-nav data-login-href="../auth/?redirect=../todo/" aria-label="계정 및 동기화 상태"></div>
            <details class="theme-menu">
                <summary title="설정"><svg class="theme-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg><span class="visually-hidden">설정</span></summary>
                <div class="theme-menu-panel">
                    <div class="theme-menu-account">
                        <p class="theme-menu-label">계정</p>
                        <div class="auth-nav" data-auth-nav data-login-href="../auth/?redirect=../todo/" aria-label="계정"></div>
                    </div>
                    <div class="theme-controls" aria-label="화면 테마">
                        <p class="theme-menu-label" aria-hidden="true">색상</p>
                        <div class="theme-group" role="group" aria-label="테마 색상">
                            <button class="theme-option palette-option" type="button" data-palette-option="blue" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>블루</button>
                            <button class="theme-option palette-option" type="button" data-palette-option="purple" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>보라</button>
                            <button class="theme-option palette-option" type="button" data-palette-option="orange" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>주황</button>
                            <button class="theme-option palette-option" type="button" data-palette-option="coral" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>다홍</button>
                            <button class="theme-option palette-option" type="button" data-palette-option="pink" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>분홍</button>
                            <button class="theme-option palette-option" type="button" data-palette-option="teal" aria-pressed="false"><span class="palette-dot" aria-hidden="true"></span>청록</button>
                        </div>
                        <p class="theme-menu-label" aria-hidden="true">밝기</p>
                        <div class="theme-group theme-modes" role="group" aria-label="화면 밝기">
                            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>라이트</button>
                            <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>다크</button>
                        </div>
                        <p class="theme-menu-label" aria-hidden="true">글씨체</p>
                        <div class="theme-group" role="group" aria-label="글씨체">
                            <button class="theme-option font-option" type="button" data-font-option="pretendard" aria-pressed="false">프리텐다드</button>
                            <button class="theme-option font-option" type="button" data-font-option="gothic-a1" aria-pressed="false">고딕 A1</button>
                            <button class="theme-option font-option" type="button" data-font-option="wanted" aria-pressed="false">원티드 산스</button>
                            <button class="theme-option font-option" type="button" data-font-option="maruburi" aria-pressed="false">마루부리</button>
                            <button class="theme-option font-option" type="button" data-font-option="gowun" aria-pressed="false">고운바탕</button>
                            <button class="theme-option font-option" type="button" data-font-option="noto-serif" aria-pressed="false">본명조</button>
                        </div>
                        <p class="theme-menu-note">윗줄은 고딕, 아랫줄은 명조입니다. 이 기기에만 저장됩니다.</p>
                    </div>
                </div>
            </details>
        </div>
    </header>
    <main class="container">
        <h1>할 일</h1>

        <div class="input-section">
            <label class="sr-only" for="todoInput">새로운 할 일</label>
            <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요...">
            <button id="addBtn" type="button">추가</button>
        </div>

        <div class="filter-section" aria-label="할 일 필터">
            <button class="filter-btn active" type="button" data-filter="all">전체</button>
            <button class="filter-btn" type="button" data-filter="active">진행중</button>
            <button class="filter-btn" type="button" data-filter="completed">완료</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="todoCount">0개 남음</span>
            <button id="clearCompleted" type="button">완료된 항목 삭제</button>
        </div>
    </main>

    <script src="../app.js?v=20260924-cloud" defer></script>
</body>
</html>
