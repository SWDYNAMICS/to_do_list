<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배운 것 기록</title>
    <script src="../shared/theme.js?v=20260925-modes"></script>
    <link rel="stylesheet" href="../shared/theme.css?v=20260926-dark-contrast">
    <link rel="stylesheet" href="learning.css?v=20261002-editor-release">
    <link rel="stylesheet" href="editor.css?v=20261002-editor-colors">
    <link rel="stylesheet" href="../shared/auth-nav.css?v=20260925-modes">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" defer></script>
    <script src="../shared/supabase-config.js?v=20260924-auth" defer></script>
    <script src="../shared/backend.js?v=20260924-auth" defer></script>
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#2455a4">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <main class="learning-page">
        <div class="theme-controls" role="group" aria-label="화면 테마">
            <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false"><span aria-hidden="true">☀</span> 라이트</button>
            <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false"><span aria-hidden="true">☾</span> 다크</button>
        </div>
        <div class="auth-nav" data-auth-nav data-login-href="../auth/?redirect=../learning/" aria-label="계정 및 동기화 상태"></div>
        <a class="back-link" href="../">← 메인으로</a>

        <header class="page-header">
            <span class="eyebrow">LEARNING LOG</span>
            <h1>오늘은 무엇을<br>새롭게 알게 됐나요?</h1>
            <p>기억하고 싶은 내용을 짧게라도 남겨보세요.</p>
        </header>

        <div class="content-grid">
            <section class="write-panel" aria-labelledby="writeTitle">
                <h2 id="writeTitle">새 기록 작성</h2>
                <form id="learningForm">
                    <div class="field">
                        <label for="learningTitle">제목</label>
                        <input id="learningTitle" type="text" maxlength="80" placeholder="예: JavaScript 이벤트 루프" required>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="learningCategory">분류</label>
                            <input id="learningCategory" type="text" maxlength="30" placeholder="예: 웹 기초">
                        </div>
                        <div class="field">
                            <label for="learningDate">날짜</label>
                            <input id="learningDate" type="date" required>
                        </div>
                    </div>

                    <div class="field">
                        <span id="learningContentLabel" class="editor-label">배운 내용</span>
                        <div class="editor-shell">
                            <div id="editorToolbar" class="editor-toolbar" role="group" aria-label="본문 서식">
                                <select data-heading aria-label="제목 단계">
                                    <option value="0">본문</option>
                                    <option value="1">제목 1</option><option value="2">제목 2</option><option value="3">제목 3</option>
                                    <option value="4">제목 4</option><option value="5">제목 5</option><option value="6">제목 6</option>
                                </select>
                                <button type="button" data-command="bold" aria-pressed="false">굵게</button>
                                <button type="button" data-command="italic" aria-pressed="false">기울임</button>
                                <span class="text-color-palette" role="group" aria-label="글자 색상">
                                    <button type="button" class="text-color-option" data-text-color-option="blue" title="파랑" aria-label="글자 색상 파랑" aria-pressed="false"><span data-text-color="blue" aria-hidden="true">가</span></button>
                                    <button type="button" class="text-color-option" data-text-color-option="green" title="초록" aria-label="글자 색상 초록" aria-pressed="false"><span data-text-color="green" aria-hidden="true">가</span></button>
                                    <button type="button" class="text-color-option" data-text-color-option="teal" title="청록" aria-label="글자 색상 청록" aria-pressed="false"><span data-text-color="teal" aria-hidden="true">가</span></button>
                                    <button type="button" class="text-color-option" data-text-color-option="orange" title="주황" aria-label="글자 색상 주황" aria-pressed="false"><span data-text-color="orange" aria-hidden="true">가</span></button>
                                    <button type="button" class="text-color-option" data-text-color-option="red" title="빨강" aria-label="글자 색상 빨강" aria-pressed="false"><span data-text-color="red" aria-hidden="true">가</span></button>
                                    <button type="button" class="text-color-option" data-text-color-option="purple" title="보라" aria-label="글자 색상 보라" aria-pressed="false"><span data-text-color="purple" aria-hidden="true">가</span></button>
                                    <button type="button" data-text-color-option="" aria-label="글자 색상 기본색으로 되돌리기" aria-pressed="true">기본색</button>
                                </span>
                                <button type="button" data-command="bulletList" aria-pressed="false">• 목록</button>
                                <button type="button" data-command="orderedList" aria-pressed="false">1. 목록</button>
                                <button type="button" data-command="taskList" aria-pressed="false">체크리스트</button>
                                <button type="button" data-command="outdent">내어쓰기</button>
                                <button type="button" data-command="indent">들여쓰기</button>
                                <button type="button" data-command="blockquote" aria-pressed="false">인용</button>
                                <button type="button" data-command="codeBlock" aria-pressed="false">코드</button>
                                <button type="button" data-command="table">표 추가</button>
                                <span data-table-actions hidden>
                                    <button type="button" data-command="addRow">행 추가</button>
                                    <button type="button" data-command="addColumn">열 추가</button>
                                    <button type="button" data-command="deleteTable">표 삭제</button>
                                </span>
                                <button type="button" data-command="undo">되돌리기</button>
                                <button type="button" data-command="redo">다시 실행</button>
                            </div>
                            <div class="editor-options">
                                <label for="pasteMode">붙여넣기</label>
                                <select id="pasteMode">
                                    <option value="auto">자동 · 서식 유지</option>
                                    <option value="markdown">마크다운으로 변환</option>
                                    <option value="plain">일반 텍스트</option>
                                </select>
                            </div>
                            <details class="editor-outline">
                                <summary>목차</summary>
                                <div id="editorOutline"></div>
                            </details>
                            <div id="learningEditor"></div>
                        </div>
                        <p id="editorHelp" class="editor-help">ChatGPT 답변을 그대로 붙여넣으세요. 목록에서는 Tab / Shift+Tab으로 들여쓰기를 조절할 수 있습니다.</p>
                    </div>

                    <div class="form-actions">
                        <button id="saveRecord" class="save-btn" type="submit">기록 저장하기</button>
                        <button id="cancelEdit" class="cancel-edit" type="button" hidden>수정 취소</button>
                    </div>
                    <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
                </form>
            </section>

            <section class="records-panel" aria-labelledby="recordsTitle">
                <div class="records-heading">
                    <h2 id="recordsTitle">나의 기록</h2>
                    <span id="recordCount">0개</span>
                </div>
                <p id="emptyMessage" class="empty-message">아직 기록이 없습니다.<br>오늘 배운 것부터 적어보세요!</p>
                <div id="learningList" class="learning-list"></div>
            </section>
        </div>
    </main>

    <script src="editor.bundle.js?v=20261002-editor-colors" defer></script>
    <script src="learning.js?v=20261003-recent-edit" defer></script>
</body>
</html>
