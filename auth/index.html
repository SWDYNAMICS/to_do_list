<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="나의 기록 공간 로그인 및 회원가입">
    <title>로그인 | 나의 기록 공간</title>
    <link rel="stylesheet" href="auth.css?v=20260924-auth">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.min.js" defer></script>
    <script src="../shared/supabase-config.js?v=20260924-auth" defer></script>
    <script src="../shared/backend.js?v=20260924-auth" defer></script>
    <script src="auth-page.js?v=20260924-auth" defer></script>
</head>
<body>
    <main class="auth-page">
        <a class="back-link" href="../">← 메인으로</a>

        <section class="auth-card" aria-labelledby="authTitle">
            <div class="auth-intro">
                <span class="eyebrow">MY DAILY SPACE</span>
                <h1 id="authTitle">어디서든 같은 기록을<br>이어가세요.</h1>
                <p>로그인하면 할 일, 연결 계획, TIL이 안전하게 저장되고 다른 기기에도 동기화됩니다.</p>
            </div>

            <div class="auth-panel">
                <div class="auth-tabs" role="tablist" aria-label="계정 메뉴">
                    <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-selected="true" data-mode="login">로그인</button>
                    <button id="signupTab" class="auth-tab" type="button" role="tab" aria-selected="false" data-mode="signup">회원가입</button>
                </div>

                <form id="authForm" novalidate>
                    <div class="field">
                        <label for="email">이메일</label>
                        <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
                    </div>
                    <div class="field">
                        <label for="password">비밀번호</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="8자 이상 입력" required>
                    </div>

                    <div class="auto-login-note">
                        <span aria-hidden="true">✓</span>
                        <p><strong>자동 로그인</strong><br>안전한 세션으로 로그인 상태가 유지됩니다.</p>
                    </div>

                    <button id="authSubmit" class="submit-button" type="submit">로그인</button>
                    <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
